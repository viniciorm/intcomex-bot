name: Deploy ViniBot to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploying via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /root/tupartnerti
            # Detener cualquier proceso de python antiguo que pudiera estar corriendo en el host fuera de Docker
            pkill -f "telegram_agent.py" || true
            pkill -f "main_orchestrator.py" || true
            pkill -f "sync_bot.py" || true
            systemctl stop vinibot || true 2>/dev/null
            systemctl stop telegram-agent || true 2>/dev/null
            
            git fetch origin
            git reset --hard origin/main
            docker compose down --remove-orphans || true
            docker compose up -d --build --remove-orphans
            docker compose restart dashboard-ui
            sleep 3
            echo "=== Despliegue completado y procesos limpios ==="
